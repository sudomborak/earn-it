<h2 mat-dialog-title>
  {{ isEditMode ? 'Edit Task' : 'Add New Task' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="taskForm" class="task-form">
    <!-- Title Field -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Task Title</mat-label>
      <input matInput formControlName="title" placeholder="Enter task title" />
      @if (taskForm.get('title')?.invalid && taskForm.get('title')?.touched) {
        <mat-error>{{ getErrorMessage('title') }}</mat-error>
      }
    </mat-form-field>

    <!-- Type Field -->
    <div class="form-field-wrapper">
      <label class="form-label">Task Type</label>
      <mat-radio-group formControlName="type" class="radio-group">
        <mat-radio-button [value]="TaskType.Daily">Daily</mat-radio-button>
        <mat-radio-button [value]="TaskType.Weekly">Weekly</mat-radio-button>
      </mat-radio-group>
    </div>

    <!-- Value Field -->
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Euro Value</mat-label>
      <input
        matInput
        type="number"
        formControlName="value"
        placeholder="0.00"
        step="0.01"
        min="0.01"
      />
      <span matPrefix>€&nbsp;</span>
      @if (taskForm.get('value')?.invalid && taskForm.get('value')?.touched) {
        <mat-error>{{ getErrorMessage('value') }}</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button
    mat-raised-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="taskForm.invalid"
  >
    {{ isEditMode ? 'Update' : 'Add' }}
  </button>
</mat-dialog-actions>
