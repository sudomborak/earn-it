<mat-sidenav-container class="app-container" fullscreen>
  <!-- Sidebar -->
  <mat-sidenav
    #sidenav
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="sidebarOpen()"
    class="app-sidenav"
  >
    <div class="sidenav-header">
      <h2 class="app-title">EarnIt</h2>
      <p class="app-subtitle">Earn your rewards</p>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>
      </a>
      <!-- Future navigation items can be added here -->
      <!-- Example for future login:
      <a mat-list-item routerLink="/profile">
        <mat-icon matListItemIcon>account_circle</mat-icon>
        <span matListItemTitle>Profile</span>
      </a>
      -->
    </mat-nav-list>
  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content class="app-content">
    <!-- Header -->
    <mat-toolbar color="primary" class="app-toolbar">
      <button
        mat-icon-button
        (click)="toggleSidebar()"
        class="menu-button"
        aria-label="Toggle menu"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">EarnIt</span>
      <span class="spacer"></span>
      <!-- Future: User menu can be added here -->
    </mat-toolbar>

    <!-- Router Outlet for main content -->
    <div class="content-wrapper">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
